# Requires metrics-server (see docs/KUBERNETES.md). Not applied by default on low-RAM laptops.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cloudpilot, namespace: cloudpilot}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cloudpilot}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
